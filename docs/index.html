/* Layout: one-column phone app, Damascene teal + jasmine; reward currency is jasmine flowers (ياسمين الشام). Single bright look by choice. */
:root{
  --ground:#E6F3F1; --card:#FFFFFF; --ink:#15283A; --muted:#55697A; --line:#CBE2DF;
  --teal:#0E7C77; --teal-d:#08504D; --sun:#FFC83D; --pom:#DD3F57; --leaf:#2E9A57;
  --math:#2F6BD3; --ar:#0E7C77; --sci:#2E9A57; --en:#7E4FD0; --isl:#B87418;
  --display:'Lalezar','Tajawal',system-ui,sans-serif;
  --body:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;direction:rtl;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:14px 20px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:2rem}h2{font-size:1.45rem}h3{font-size:1.15rem}
p{margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}

/* top bar */
.top{display:flex;align-items:center;gap:12px}
.top .hi{flex:1;min-width:0}
.top .hi small{display:block;color:var(--muted);font-size:.9rem}
.top .hi h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.jas{width:22px;height:22px;flex:none}

/* hero: today's challenge */
.today{background:var(--teal);color:#fff;border-radius:26px;padding:20px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.today::after{content:"";position:absolute;inset-inline-start:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#ffffff22,#ffffff00 70%)}
.today .date{opacity:.85;font-size:.95rem}
.today h1{font-size:2.1rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#ffffff26;border-radius:999px;padding:2px 10px;font-size:.85rem;font-weight:700}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;border-radius:16px;padding:13px 20px;font-weight:800;font-size:1.05rem;min-height:52px}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #C99410}
.btn.sun:active{transform:translateY(3px);box-shadow:0 1px 0 #C99410}
.btn.teal{background:var(--teal);color:#fff;box-shadow:0 4px 0 var(--teal-d)}
.btn.teal:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal-d)}
.btn.ghost{background:var(--card);border:1.5px solid var(--line)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.done-badge{background:#ffffff26;border-radius:16px;padding:12px 14px;font-weight:700}

/* hadith */
.hadith{background:var(--card);border-radius:22px;padding:18px;border:1.5px solid var(--line);display:flex;flex-direction:column;gap:10px}
.hadith .label{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--isl);font-weight:800;font-size:.9rem;letter-spacing:.02em}
.free{background:#FFF1D6;color:#7A4A06;border-radius:999px;padding:1px 10px;font-size:.78rem}
.hadith blockquote{margin:0;font-family:var(--display);font-size:1.5rem;line-height:1.55;color:var(--ink)}
.hadith .src{color:var(--muted);font-size:.9rem}
.hadith .ex{background:var(--ground);border-radius:14px;padding:10px 12px;font-size:.98rem}

/* subjects */
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.subj{background:var(--card);border-radius:18px;padding:14px;text-align:start;display:flex;flex-direction:column;gap:6px;border-bottom:4px solid var(--c);min-height:104px}
.subj .ico{width:38px;height:38px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:1.3rem}
.subj b{font-size:1.02rem}
.subj small{color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
.subj.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0}
.subj.wide .t{display:flex;flex-direction:column}
.lockveil{position:relative}
.lockveil.locked .subj{opacity:.55}

.links{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status{border-radius:16px;padding:12px 14px;font-weight:700;font-size:.95rem;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.status.ok{background:#DDF2E4;color:#145C31}
.status.trial{background:#FFF1D6;color:#7A4A06}
.status.off{background:#FBDDE2;color:#8A1C2E}

/* onboarding */
.onb{display:flex;flex-direction:column;gap:18px;padding-top:10px}
.logo{display:flex;align-items:center;gap:12px}
.logo h1{font-size:2.8rem;color:var(--teal)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:800}
input[type=text]{font:inherit;font-size:1.15rem;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.grades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grades button{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 4px;font-weight:800;display:flex;flex-direction:column;align-items:center}
.grades button span{font-family:var(--display);font-size:1.6rem;line-height:1.1;color:var(--teal)}
.grades button.on{border-color:var(--teal);background:var(--teal);color:#fff}
.grades button.on span{color:var(--sun)}

/* quiz */
.qbar{display:flex;align-items:center;gap:10px}
.x{width:44px;height:44px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-size:1.4rem;line-height:1}
.prog{flex:1;display:flex;gap:5px}
.prog i{flex:1;height:10px;border-radius:6px;background:var(--line)}
.prog i.ok{background:var(--leaf)}.prog i.no{background:var(--pom)}.prog i.cur{background:var(--sun)}
.qcard{background:var(--card);border-radius:24px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;border-top:6px solid var(--c)}
.qcard .tag{color:var(--c);font-weight:800;font-size:.9rem}
.qcard .pre{font-family:var(--display);font-size:1.25rem;background:#FFF6E3;border-radius:14px;padding:10px 12px;color:#5C3A06}
.qcard .q{font-size:1.45rem;font-weight:800;white-space:pre-line;line-height:1.5}
.qcard .en{direction:ltr;text-align:left;font-size:1.35rem;font-weight:700;background:var(--ground);border-radius:12px;padding:8px 12px;unicode-bidi:isolate}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 10px;font-size:1.3rem;font-weight:800;min-height:68px;box-shadow:0 4px 0 var(--line);unicode-bidi:plaintext}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.right{background:#DDF2E4;border-color:var(--leaf);box-shadow:0 4px 0 var(--leaf)}
.opt.wrong{background:#FBDDE2;border-color:var(--pom);box-shadow:0 4px 0 var(--pom)}
.opt[disabled]{pointer-events:none}
.fb{border-radius:18px;padding:14px;font-weight:800;display:flex;flex-direction:column;gap:10px}
.fb.good{background:#DDF2E4;color:#145C31}.fb.bad{background:#FBDDE2;color:#8A1C2E}

/* result */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:30px}
.result .big{width:120px;height:120px;animation:pop .6s ease-out}
.score{font-family:var(--display);font-size:3rem;color:var(--teal);font-variant-numeric:tabular-nums}
@keyframes pop{0%{transform:scale(.3) rotate(-40deg)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.fall{position:fixed;top:-40px;width:26px;height:26px;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.fall{display:none}.result .big{animation:none}}

/* panels */
.panel{background:var(--card);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;border:1.5px solid var(--line)}
.bar{height:12px;background:var(--ground);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:8px}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .row{justify-content:space-between;font-variant-numeric:tabular-nums}
.price{font-family:var(--display);font-size:1.8rem;color:var(--teal)}
.steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
.msg{font-weight:800;font-size:.95rem}
.msg.ok{color:var(--leaf)}.msg.no{color:var(--pom)}
.code{font-family:ui-monospace,monospace;direction:ltr;font-size:1.4rem;font-weight:800;letter-spacing:.08em;background:var(--ground);border-radius:12px;padding:10px;text-align:center;user-select:all}
.ver{color:var(--muted);font-size:.8rem;text-align:center;padding:8px;user-select:none}
.confirm{background:#FBDDE2;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

/* accounts, children, plans, admin */
input[type=tel],input[type=password]{font:inherit;font-size:1.15rem;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%;text-align:left}
input:focus{border-color:var(--teal);outline:none}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:4px}
.tabs button{border-radius:12px;padding:10px 6px;font-weight:800;color:var(--muted)}
.tabs button.on{background:var(--teal);color:#fff}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.9rem;border-radius:12px}
.row.between{justify-content:space-between}
.okc{color:var(--leaf)}.offc{color:var(--pom)}
.sel{user-select:all;font-variant-numeric:tabular-nums}
.kids{display:flex;flex-direction:column;gap:10px}
.kid{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:12px 14px;text-align:start;box-shadow:0 4px 0 var(--line)}
.kid:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.kid .av{width:48px;height:48px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:1.5rem;flex:none}
.kid .t{flex:1;min-width:0;display:flex;flex-direction:column}
.kid .t small{color:var(--muted)}
.kid.add{border-style:dashed;box-shadow:none}
.kid.add .av{background:var(--ground);color:var(--teal)}
.tag{border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:800;white-space:nowrap}
.tag.ok{background:#DDF2E4;color:#145C31}.tag.trial{background:#FFF1D6;color:#7A4A06}.tag.off{background:#FBDDE2;color:#8A1C2E}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.plan .price{font-family:var(--display);font-size:1.2rem;color:var(--teal);text-align:center}
.plan small{color:var(--muted)}
.plan.on{border-color:var(--teal);background:#DFF1EF;box-shadow:inset 0 0 0 1px var(--teal)}
.plan[disabled]{opacity:.6}
.req{gap:8px}
.copyright{color:var(--muted);font-size:.75rem;text-align:center;opacity:.85;padding-inline:16px;padding-block:0 24px;max-width:520px;margin:0 auto}
.copyright span{direction:ltr;unicode-bidi:isolate}
.lessons{display:flex;flex-direction:column;gap:8px}
.unit{font-size:1rem;color:var(--muted);margin-top:8px}
.lesson{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:start;font-weight:700}
.lesson.now{border-color:var(--leaf);background:#EEF9F1}
.four-t{grid-template-columns:repeat(4,1fr)}.four-t button{font-size:.85rem;padding:10px 2px}
.spk{width:40px;height:40px;border-radius:12px;background:var(--ground);font-size:1.2rem;flex:none}
.hadith .label .spk{width:34px;height:34px;font-size:1rem;margin-inline-start:6px;vertical-align:middle}
.ava{width:48px;height:48px;border-radius:50%;background:var(--card);border:2px solid var(--sun);display:grid;place-items:center;font-size:1.7rem;flex:none}
.ava.big{width:60px;height:60px;font-size:2.2rem}
button.pill{cursor:pointer}
.store{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.item{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.item .e{font-size:2.2rem;line-height:1.2}.item b{font-size:.85rem}.item small{color:var(--muted);font-size:.75rem}
.item.on{border-color:var(--teal);background:#DFF1EF}.item[aria-disabled=true]{opacity:.55}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.badge{background:var(--card);border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;text-align:center;filter:grayscale(1);opacity:.45}
.badge span{font-size:1.7rem}.badge small{font-size:.7rem;font-weight:700}.badge.got{filter:none;opacity:1;border:2px solid var(--sun)}
.quran p{font-family:var(--display);font-size:1.5rem;line-height:1.9;margin:0}
.ayah{color:var(--isl);font-size:1rem}
.quranpre{font-size:1.35rem}.qopt{font-size:1.05rem;font-family:var(--display);grid-column:1/-1;font-weight:400}
.pic{font-size:3.6rem;text-align:center;line-height:1.2}
.slot{min-height:64px;border:3px dashed var(--line);border-radius:16px;display:grid;place-items:center;font-size:2rem;font-weight:800;letter-spacing:.04em}
.slot.right{border:3px solid var(--leaf);background:#DDF2E4}.slot.wrong{border:3px solid var(--pom);background:#FBDDE2}
.tiles-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tilebtn{width:64px;height:64px;border-radius:16px;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-size:1.8rem;font-weight:800}
.tilebtn[disabled]{opacity:.25;box-shadow:none}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week span{text-align:center;border-radius:10px;padding:6px 0;background:var(--ground);color:var(--muted);font-weight:800;font-size:.85rem}
.week span.on{background:var(--leaf);color:#fff}
.tip{background:#FFF1D6;border-radius:12px;padding:10px 12px;font-size:.95rem}
.cert{width:100%;border-radius:18px;box-shadow:0 6px 24px #0e7c7733}
.sham{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:10px;text-align:center}
.sham img{width:min(260px,100%);border-radius:16px;background:#fff}
.small-code{font-size:.95rem!important;letter-spacing:0!important;word-break:break-all}
.qrprev img{width:160px;border-radius:12px;background:#fff}
input[type=file]{font:inherit;font-size:.9rem}
input[type=time]{font:inherit;font-size:1.1rem;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--display);font-size:1.8rem;color:var(--teal);font-weight:400;font-variant-numeric:tabular-nums}.tile span{color:var(--muted);font-size:.9rem}
.tile.ok b{color:var(--leaf)}
.gbar{display:grid;grid-template-columns:64px 1fr 32px;align-items:center;gap:8px;font-size:.9rem}
.exp{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;border-bottom:1px solid var(--line)}
.exp:last-child{border-bottom:0}.exp>div{min-width:0}
a.btn{text-decoration:none;white-space:nowrap}
.three-t{grid-template-columns:repeat(3,1fr)}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function nearN(ans,spread,min){spread=spread||3;min=min===undefined?0:min;const s=new Set();let g=0;while(s.size<3&&g++<80){const v=ans+ri(1,spread)*(R()<.5?-1:1);if(v>=min&&v!==ans)s.add(v)}let k=1;while(s.size<3){if(!s.has(ans+k))s.add(ans+k);k++}return[...s]}

// تقويم العام الدراسي: بداية كل فصل وعدد أسابيعه
const CAL={s1:Date.UTC(2026,8,13),w1:17,s2:Date.UTC(2027,1,7),w2:15};
function schoolPos(){const t=Date.now();if(t<CAL.s2-14*864e5){return{sem:1,week:Math.max(0,Math.floor((t-CAL.s1)/(7*864e5)))}}return{sem:2,week:Math.max(0,Math.floor((t-CAL.s2)/(7*864e5)))}}
const curOf=(g,s)=>(window.CUR&&CUR[g]&&CUR[g][s])||[];
const semLessons=(g,s,sem)=>curOf(g,s).map((l,i)=>Object.assign({i},l)).filter(l=>l.sem===sem);
function currentLesson(g,s){const p=schoolPos(),L=semLessons(g,s,p.sem);if(!L.length)return null;const W=p.sem===1?CAL.w1:CAL.w2;const k=Math.min(L.length-1,Math.floor(Math.min(p.week,W-1)/W*L.length));return{lesson:L[k],k,L}}
// منع التكرار: نتذكر آخر الأسئلة اللي شافها الطفل ونفضّل الجديدة
const qKey=q=>(q.q||'')+'|'+(q.en||'')+'|'+(q.pre||'')+'|'+(q.a||'');
const seenSet=()=>{if(!S)return new Set();S.seen=S.seen||[];return new Set(S.seen)};
function markSeen(q){if(!S)return;S.seen=S.seen||[];const k=qKey(q);const i=S.seen.indexOf(k);if(i>=0)S.seen.splice(i,1);S.seen.push(k);if(S.seen.length>600)S.seen.splice(0,S.seen.length-600)}
function bankItem(e){if(e.kind)return Object.assign({},e);const[qq,en]=String(e[0]).split('||');return mc(qq,e[1],e.slice(2),Object.assign({m:/^[0-9٠-٩٫.,/ ]+$/.test(e[1])},en?{en}:{}))}
function lessonQ(g,s,l,avoid){
  let q=null;avoid=avoid||seenSet();
  if(l.gen&&l.gen.length&&window.MATHG){for(let t=0;t<12;t++){const f=MATHG[pick(l.gen)];if(!f)break;q=f(g);if(!avoid.has(qKey(q)))break}}
  if(!q&&l.q&&l.q.length){const items=shuf(l.q).map(bankItem);q=items.find(x=>!avoid.has(qKey(x)))||items[0]}
  if(!q)q=GEN_FOR[s](g);
  return Object.assign({s,lt:l.t},q);
}
function buildDaily(g){
  const d=dayIdx(),old=R;R=mulberry32(hash('daily|'+d+'|'+g));
  const av=seenSet();
  try{return['math','ar','sci','en'].map(s=>{const c=currentLesson(g,s);if(c){const pool=shuf(c.L.slice(Math.max(0,c.k-2),c.k+1));for(const l of pool){const q=lessonQ(g,s,l,av);if(!av.has(qKey(q)))return q}return lessonQ(g,s,pool[0],av)}return Object.assign({s},GEN_FOR[s](g))}).concat([Object.assign({s:'isl'},hadithQ(todayHadith()))])}finally{R=old}
}
function buildPractice(s,g,li){
  const N=8,out=[],used=new Set(),old=seenSet(),all=curOf(g,s),L=li!=null?all[li]:null;
  const add=q=>{const k=qKey(q);if(used.has(k))return false;used.add(k);out.push(q);return true};
  const fromLesson=(l,fresh)=>{if(l.gen&&l.gen.length){for(let t=0;t<30&&out.length<N;t++){const q=lessonQ(g,s,l,new Set([...old,...used]));if(fresh&&old.has(qKey(q)))continue;add(q)}}else{shuf(l.q||[]).map(bankItem).forEach(x=>{if(out.length>=N)return;if(fresh&&old.has(qKey(x)))return;add(Object.assign({s,lt:l.t},x))})}};
  if(L){
    fromLesson(L,true);                                   // أسئلة الدرس الجديدة أولاً
    if(out.length<N){const sib=shuf(all.filter(x=>x!==L&&x.sem===L.sem&&x.unit===L.unit));sib.forEach(x=>fromLesson(x,true))}   // دروس نفس الوحدة
    if(out.length<N)fromLesson(L,false);                  // ثم ما سبق رؤيته من الدرس
  }else{
    const p=schoolPos(),pool=shuf(all.filter(x=>x.sem===p.sem));pool.forEach(x=>{if(out.length<N)fromLesson(x,true)});
  }
  for(let t=0;out.length<N&&t<80;t++){const q=Object.assign({s},GEN_FOR[s](g));if(!old.has(qKey(q))||t>40)add(q)}  // تكملة من بنك المادة العام
  return shuf(out).slice(0,N);
}

const AR2EN=s=>String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
function normPhone(p){let d=AR2EN(p).replace(/\D/g,'');if(d.startsWith('00963'))d=d.slice(5);else if(d.startsWith('963'))d=d.slice(3);if(d.length===9&&d[0]==='9')d='0'+d;return/^09\d{8}$/.test(d)?d:null}
const normCode=c=>AR2EN(c).replace(/\D/g,'');
const isAdminPhone=p=>p===normPhone(CONFIG.adminPhone);
const today=()=>dayIdx();
const tsDay=t=>t==null?today():typeof t==='number'?t:dayIdx(new Date(t.toMillis?t.toMillis():t));
function newUntil(cur,days){return Math.max(cur==null?-1:cur,today()-1)+days}
function newCode(){let s='';const a=new Uint32Array(8);(window.crypto||{}).getRandomValues?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.random()*1e9);a.forEach(x=>s+=x%10);return s[0]==='0'?'7'+s.slice(1):s}

/* ---- الوضع التجريبي: كل البيانات على هذا الجهاز ---- */
function DemoBackend(){
  const K='shattoor_demo_db2';
  let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
  if(!D)D={parents:{},children:{},requests:{},resets:{},settings:null,session:null,n:1};
  const adm=normPhone(CONFIG.adminPhone);
  if(adm&&!D.parents[adm]){D.parents[adm]={name:'الإدارة',pass:'123456',created:today()-30};D.children[adm]={}}
  const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};save();
  const id=()=>'x'+(D.n++)+Math.random().toString(36).slice(2,6);
  const me=()=>D.session&&D.parents[D.session]?{uid:D.session,phone:D.session,name:D.parents[D.session].name,created:D.parents[D.session].created}:null;
  const wait=v=>new Promise(r=>setTimeout(()=>r(v),120));
  const kids=p=>Object.entries(D.children[p]||{}).map(([k,v])=>Object.assign({id:k},v));
  return{
    demo:true,
    async init(){return wait(me())},
    async signUp(phone,name,pass){if(D.parents[phone])throw fail('auth/email-already-in-use');if(pass.length<6)throw fail('auth/weak-password');D.parents[phone]={name,pass,created:today()};D.children[phone]={};D.session=phone;save();return wait(me())},
    async signIn(phone,pass){const u=D.parents[phone];if(!u)throw fail('auth/user-not-found');if(u.pass!==pass)throw fail('auth/wrong-password');D.session=phone;save();return wait(me())},
    async resetWithCode(phone,code,pass){const r=D.resets[phone];if(!D.parents[phone]||!r)throw fail('no-reset');if(r.key!==code)throw fail('bad-code');if(pass.length<6)throw fail('auth/weak-password');D.parents[phone].pass=pass;delete D.resets[phone];D.session=phone;save();return wait(me())},
    async signOut(){D.session=null;save()},
    async getSettings(){return wait(mergeSettings(D.settings))},
    async saveSettings(s){D.settings=s;save();return wait()},
    async listChildren(){return wait(kids(D.session))},
    async addChild(c){const k=id();D.children[D.session][k]=Object.assign({subs:{}},c);save();return wait(k)},
    async updateChild(cid,p){Object.assign(D.children[D.session][cid],p);save();return wait()},
    async deleteChild(cid){delete D.children[D.session][cid];save();return wait()},
    async requestSub(r){const k=id();D.requests[k]=Object.assign({status:'pending',created:today()},r);save();return wait(k)},
    async myRequests(){return wait(Object.entries(D.requests).filter(([k,r])=>r.phone===D.session).map(([k,r])=>Object.assign({id:k},r)))},
    async pending(){return wait(Object.entries(D.requests).filter(([k,r])=>r.status==='pending').map(([k,r])=>Object.assign({id:k},r)))},
    async findByPhone(phone){const u=D.parents[phone];if(!u)return wait(null);return wait({phone,name:u.name,created:u.created,reset:D.resets[phone]?D.resets[phone].key:null,children:kids(phone)})},
    async activate(phone,cid,grade,plan){const c=D.children[phone]&&D.children[phone][cid];if(!c)throw fail('not-found');c.subs=c.subs||{};const cur=c.subs[grade];c.subs[grade]={plan,until:newUntil(cur&&cur.until,PLANS[plan].days)};save();return wait(c.subs[grade])},
    async cancelSub(phone,cid,grade){delete D.children[phone][cid].subs[grade];save();return wait()},
    async resolve(rid,status){D.requests[rid].status=status;D.requests[rid].done=today();save();return wait()},
    async makeReset(phone){const key=newCode();D.resets[phone]={key,created:today()};save();return wait(key)},
    async logActivation(r){const k=id();D.requests[k]=Object.assign({created:today(),done:today()},r);save();return wait(k)},
    async stats(){return wait({parents:Object.entries(D.parents).map(([phone,u])=>({phone,name:u.name})),kids:Object.entries(D.children).flatMap(([phone,o])=>Object.entries(o).map(([id,c])=>Object.assign({phone,id},c))),approved:Object.values(D.requests).filter(r=>r.status==='approved')})}
  };
}

function FirebaseBackend(cfg){

  const emailOf=(p,key)=>key?`${p}.${key}${dom}`:p+dom;

  const load=async fu=>{if(!fu)return U=null;const phone=fu.email.split('@')[0].split('.')[0];const s=await P(phone).get();const d=s.exists?s.data():{};

    U={uid:fu.uid,phone,name:d.name||'',created:tsDay(d.created)};return U};
  const kidsCol=p=>P(p).collection('children');
  const kids=async p=>(await kidsCol(p).get()).docs.map(d=>Object.assign({id:d.id},d.data()));
  return{
    demo:false,
    init(){return new Promise(r=>{const off=auth.onAuthStateChanged(async fu=>{off();try{r(await load(fu))}catch(e){r(null)}})})},
    async signUp(phone,name,pass){
      const c=await auth.createUserWithEmailAndPassword(emailOf(phone),pass);
      const b=db.batch();b.set(P(phone),{phone,name,uid:c.user.uid,created:FV.serverTimestamp()});b.set(db.collection('logins').doc(phone),{key:''});await b.commit();
      return load(c.user)},
    async signIn(phone,pass){
      const l=await db.collection('logins').doc(phone).get({source:'server'}).catch(()=>db.collection('logins').doc(phone).get());
      if(!l.exists)throw fail('auth/user-not-found');
      const c=await auth.signInWithEmailAndPassword(emailOf(phone,l.data().key),pass);return load(c.user)},
    async resetWithCode(phone,code,pass){
      let c;
      try{c=await auth.createUserWithEmailAndPassword(emailOf(phone,code),pass)}
      catch(e){if(e.code==='auth/email-already-in-use'){c=await auth.signInWithEmailAndPassword(emailOf(phone,code),pass).catch(()=>{throw fail('bad-code')})}else throw e}
      try{const b=db.batch();b.update(P(phone),{uid:c.user.uid});b.set(db.collection('logins').doc(phone),{key:code});b.delete(db.collection('resets').doc(phone));await b.commit()}
      catch(e){try{await c.user.delete()}catch(x){}await auth.signOut().catch(()=>{});throw fail(e.code==='permission-denied'?'bad-code':e.code)}
      return load(c.user)},
    async signOut(){await auth.signOut();U=null},
    async getSettings(){const s=await db.doc('settings/app').get();return mergeSettings(s.exists?s.data():null)},
    saveSettings(s){return db.doc('settings/app').set(s)},
    listChildren(){return kids(U.phone)},
    async addChild(c){const r=await kidsCol(U.phone).add(Object.assign({},c));return r.id},
    updateChild(cid,p){return kidsCol(U.phone).doc(cid).update(p)},
    deleteChild(cid){return kidsCol(U.phone).doc(cid).delete()},
    async requestSub(r){const d=await db.collection('requests').add(Object.assign({status:'pending',uid:U.uid,created:FV.serverTimestamp()},r));return d.id},
    async myRequests(){return(await db.collection('requests').where('uid','==',U.uid).get()).docs.map(d=>Object.assign({id:d.id},d.data()))},
    async pending(){return(await db.collection('requests').where('status','==','pending').get()).docs.map(d=>Object.assign({id:d.id},d.data()))},
    async findByPhone(phone){const s=await P(phone).get();if(!s.exists)return null;const x=s.data();const r=await db.collection('resets').doc(phone).get();return{phone,name:x.name,created:tsDay(x.created),reset:r.exists?r.data().key:null,children:await kids(phone)}},
    async activate(phone,cid,grade,plan){const ref=kidsCol(phone).doc(cid);const s=await ref.get();if(!s.exists)throw fail('not-found');const cur=((s.data().subs||{})[grade]||{}).until;const v={plan,until:newUntil(cur,PLANS[plan].days)};await ref.update({['subs.'+grade]:v});return v},
    cancelSub(phone,cid,grade){return kidsCol(phone).doc(cid).update({['subs.'+grade]:FV.delete()})},
    resolve(rid,status){return db.collection('requests').doc(rid).update({status,done:FV.serverTimestamp()})},
    async makeReset(phone){const key=newCode();await db.collection('resets').doc(phone).set({key,created:FV.serverTimestamp()});return key},
    async logActivation(r){await db.collection('requests').add(Object.assign({uid:U.uid,created:FV.serverTimestamp(),done:FV.serverTimestamp()},r))},
    async stats(){const[ps,cs,rq]=await Promise.all([db.collection('parents').get(),db.collectionGroup('children').get(),db.collection('requests').where('status','==','approved').get()]);
      return{parents:ps.docs.map(d=>({phone:d.id,name:d.data().name})),kids:cs.docs.map(d=>Object.assign({phone:d.ref.parent.parent.id,id:d.id},d.data())),approved:rq.docs.map(d=>d.data())}}
  };
}

let AC;
function tone(ok){if(!S||!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;(ok?[523,659,784]:[311,233]).forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'triangle':'sine';o.frequency.value=f;const t=t0+i*.11;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.25)})}catch(e){}}

    ${it.en?`<div class="en" dir="ltr">${esc(it.en)}</div>`:''}
  </div>

  <div id="fb"></div>`;
  if(autoRead()&&!Q.read){Q.read=true;speakItem(it)}
}
function tileTap(i){const it=Q.list[Q.i];if(Q.res[Q.i]!==undefined)return;Q.usedT=Q.usedT||[];Q.built=Q.built||[];if(Q.usedT.includes(i))return;Q.usedT.push(i);Q.built.push(it.tiles[i]);
  if(Q.built.length===it.tiles.length){const ok=Q.built.join('')===it.a;viewQuiz();grade(ok,it.a)}else viewQuiz()}
function untile(){if(!Q.built||!Q.built.length||Q.res[Q.i]!==undefined)return;Q.built.pop();Q.usedT.pop();viewQuiz()}

function answer(i){
  const it=Q.list[Q.i];if(Q.res[Q.i]!==undefined)return;
  const ok=it.opts[i]===it.a;
  const btns=[...V.querySelectorAll('.opt')];
  btns.forEach((b,j)=>{b.disabled=true;if(it.opts[j]===it.a)b.classList.add('right');else if(j===i)b.classList.add('wrong')});
  grade(ok,it.a);
}
const POINTS=()=>Q.mode==='daily'?10:Q.mode==='surah'?0:5;
function grade(ok,answerText){
  const it=Q.list[Q.i];Q.res[Q.i]=ok;if(ok)Q.c++;stopSpeak();markSeen(it);
  if(Q.mode!=='surah'){const st=S.stats[it.s]||(S.stats[it.s]={c:0,t:0});st.t++;if(ok)st.c++;
    S.hist=S.hist||{};const d=today(),hd=S.hist[d]||(S.hist[d]={}),hs=hd[it.s]||(hd[it.s]={c:0,t:0});hs.t++;if(ok)hs.c++;
    const keys=Object.keys(S.hist).map(Number).sort((a,b)=>a-b);while(keys.length>60)delete S.hist[keys.shift()];}
  if(ok)S.jas+=POINTS();
  save();tone(ok);
  if(it.kind==='spell'){const sl=V.querySelector('#slot');if(sl)sl.classList.add(ok?'right':'wrong')}
  const prog=V.querySelectorAll('.prog i')[Q.i];prog.className=ok?'ok':'no';
  V.querySelector('.qbar .pill').innerHTML=`${JAS()} ${ar(bal())}`;
  const f=it.m?ar:(x=>x),praise=['أحسنت!','ممتاز!','برافو عليك!','رائع يا شطّور!'];
  const last=Q.i===Q.list.length-1;
  V.querySelector('#fb').innerHTML=`<div class="fb ${ok?'good':'bad'}"><span>${ok?pick(praise)+(POINTS()?' +'+ar(POINTS())+' ياسمينات':''):'ولا يهمك! الجواب الصحيح: '+esc(f(it.a))}</span><button class="btn ${ok?'teal':'sun'} wide" data-act="next">${last?'شوف النتيجة':'السؤال التالي'}</button></div>`;
  V.querySelector('#fb button').focus({preventScroll:true});
  V.querySelector('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function finish(){
  if(Q.mode==='daily'){
    const d=dayIdx();
    if(!S.daily[d]){S.streak=(S.lastDaily===d-1)?S.streak+1:1;S.best=Math.max(S.best||0,S.streak);S.lastDaily=d;S.daily[d]={c:Q.c,t:Q.list.length};}
    save();
  }
  if(Q.c===Q.list.length&&Q.mode!=='surah')S.perfect=(S.perfect||0)+1;
  let memoMsg='';
  if(Q.mode==='surah'){S.memo=S.memo||{};if(Q.c===Q.list.length){if(!S.memo[Q.surah]){S.memo[Q.surah]=today();S.jas+=30;memoMsg=`حفظت سورة ${SURAHS.find(x=>x.id===Q.surah).n}! +${ar(30)} ياسمينة 🌼`}else memoMsg='ما شاء الله! لسا حافظها.'}else memoMsg='راجع السورة وجرّب مرة تانية، قرّبت!'}
  save();syncSummary();
  const r=Q.c/Q.list.length,msg=r===1?'علامة كاملة!':r>=.6?'شغل حلو!':'كل يوم أحسن من اللي قبله';
  V.innerHTML=`<div class="result">${JAS('big')}
    <h1>${msg}</h1>
    <div class="score">${ar(Q.c)} / ${ar(Q.list.length)}</div>
    ${Q.mode==='surah'?`<p><b>${memoMsg}</b></p>`:`<p>جمعت <b>${ar(Q.c*POINTS())}</b> ياسمينة${Q.mode==='daily'?` · سلسلة الأيام: <b>${ar(S.streak)}</b>`:''}</p>`}
    <div style="display:flex;flex-direction:column;gap:10px;width:100%">
      ${Q.mode==='practice'?(Q.li!=null?`<button class="btn teal wide" data-act="practiceL" data-s="${Q.s}" data-i="${Q.li}">تمرين جديد على نفس الدرس</button>`:`<button class="btn teal wide" data-act="practice" data-s="${Q.s}">تمرين جديد</button>`):''}
      ${Q.mode==='surah'?`<button class="btn teal wide" data-act="go" data-v="surahs">قصار السور</button>`:''}
      <button class="btn ${Q.mode==='practice'?'ghost':'teal'} wide" data-act="go" data-v="home">الرجوع للرئيسية</button>
    </div></div>`;
  if(r>=.6)confetti();
  Q=null;
}

const stripEmoji=t=>String(t).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,' ').replace(/\s+/g,' ').trim();
function speak(text,lang){
  text=stripEmoji(text);if(!text)return;
  if(NATIVE&&NATIVE.speak){try{NATIVE.speak(text,lang||'ar');return}catch(e){}}
  try{const ss=window.speechSynthesis;if(!ss)return;ss.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang==='en'?'en-US':'ar-SA';u.rate=.85;
    const v=ss.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith(lang==='en'?'en':'ar'));if(v)u.voice=v;ss.speak(u)}catch(e){}
}
function stopSpeak(){try{if(NATIVE&&NATIVE.stopSpeak)NATIVE.stopSpeak();else if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}}
const autoRead=()=>!!(S&&S.autoRead===true);
function speakItem(it){
  if(it.kind==='spell'){speak(it.lang==='en'?'رتّب الحروف لتكتب الكلمة':'رتّب الحروف لتكتب اسم الصورة');return}
  const q=it.q.replace(/\n/g,'. ');
  speak((it.pre&&it.preKind!=='quran'?'قال رسول الله صلى الله عليه وسلم: '+it.pre+'. ':'')+q);
  if(it.en)setTimeout(()=>speak(it.en,'en'),Math.min(6000,q.length*90));
}

const TIPS={math:'تمرين ١٠ دقايق يومياً على العمليات، واستعمل أشيا من البيت للعدّ.',ar:'اقرأ معه قصة قصيرة كل يوم واسأله عن الكلمات الجديدة.',sci:'اسأله عن أشيا بيشوفها حوله: ليش بيغلي الماء؟ شو بتحتاج النبتة؟',en:'كرروا كلمات إنكليزية لأشيا بالبيت، وشوفوا فيديوهات قصيرة سوا.',isl:'احكوا قصة من السيرة قبل النوم، وراجعوا حديث اليوم سوا.'};
function weekReport(){
  const d0=today(),days=[...Array(7)].map((_,i)=>d0-i),agg={};let active=0;
  days.forEach(d=>{const h=(S.hist||{})[d];if(!h)return;active++;Object.entries(h).forEach(([s,x])=>{const a=agg[s]||(agg[s]={c:0,t:0});a.c+=x.c;a.t+=x.t})});
  const rows=Object.keys(SUBJ).map(s=>{const a=agg[s]||{c:0,t:0};return{s,c:a.c,t:a.t,p:a.t?Math.round(100*a.c/a.t):null}});
  const rated=rows.filter(r=>r.t>=3).sort((a,b)=>b.p-a.p);
  return{active,rows,best:rated[0],weak:rated.length>1?rated[rated.length-1]:null};
}
function reportHTML(){
  const r=weekReport();
  return`<section class="panel">
    <h3>تقرير آخر ٧ أيام</h3>

async function makeCertificate(){
  try{await document.fonts.ready}catch(e){}
  const W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  x.fillStyle='#E6F3F1';x.fillRect(0,0,W,H);
  x.fillStyle='#0E7C77';x.fillRect(40,40,W-80,H-80);x.fillStyle='#FFFFFF';x.fillRect(64,64,W-128,H-128);
  x.strokeStyle='#FFC83D';x.lineWidth=6;x.strokeRect(92,92,W-184,H-184);
  const flower=(cx,cy,r)=>{for(let k=0;k<5;k++){x.save();x.translate(cx,cy);x.rotate(k*Math.PI*2/5);x.beginPath();x.ellipse(0,-r*.55,r*.32,r*.55,0,0,Math.PI*2);x.fillStyle='#FFFFFF';x.fill();x.strokeStyle='#E6C96A';x.lineWidth=3;x.stroke();x.restore()}x.beginPath();x.arc(cx,cy,r*.22,0,Math.PI*2);x.fillStyle='#FFC83D';x.fill()};
  flower(W/2,230,90);flower(170,170,40);flower(W-170,170,40);flower(170,H-170,40);flower(W-170,H-170,40);
  x.textAlign='center';x.direction='rtl';
  const T=(t,y,size,font,color)=>{x.font=`${size}px ${font}`;x.fillStyle=color;x.fillText(t,W/2,y)};
  const D="'Lalezar','Tajawal',sans-serif",B="'Tajawal',sans-serif";
  T('شهادة تقدير',420,96,D,'#0E7C77');
  T('تُمنح هذه الشهادة للبطل',510,40,B,'#55697A');
  T(APP.child.name,620,110,D,'#15283A');
  const now=new Date(),mStart=dayIdx(new Date(now.getFullYear(),now.getMonth(),1));
  const mDays=Object.keys(S.daily).filter(d=>+d>=mStart).length;
  const month=new Intl.DateTimeFormat('ar-SY',{month:'long',year:'numeric'}).format(now);
  T(`لاجتهاده في شهر ${month}`,710,44,B,'#15283A');
  const lv=levelOf(S.jas);
  const stats=[[ar(mDays),'يوم تحدي'],[ar(S.jas),'ياسمينة'],[lv.name,'المستوى']];
  stats.forEach((s,i)=>{const cx=W/2+(1-i)*290;x.fillStyle='#E6F3F1';x.beginPath();x.roundRect?x.roundRect(cx-125,790,250,170,28):x.rect(cx-125,790,250,170);x.fill();
    x.font=`60px ${D}`;x.fillStyle='#0E7C77';x.fillText(s[0],cx,880);x.font=`32px ${B}`;x.fillStyle='#55697A';x.fillText(s[1],cx,930)});
  T(`الصف ${GRADES[APP.child.grade-1]}`,1040,40,B,'#55697A');
  T('شطّور',1150,64,D,'#0E7C77');
  x.font=`24px ${B}`;x.fillStyle='#55697A';x.fillText('© 2026 جميع الحقوق محفوظة · mohamedfayzyasenalsabagh@gmail.com',W/2,1215);
  return cv.toDataURL('image/png');
}

function resizeImage(file,max){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/png'))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

      <p class="muted small">تفعيلات ${month}: ${ar(monthAppr.length)}</p></section>
    <section class="panel"><h3>بينتهوا خلال أسبوع (${ar(expiring.length)})</h3>${expiring.length?expiring.map(a=>rowHTML(a,true)).join(''):'<p class="muted">ما في اشتراكات رح تنتهي قريباً.</p>'}</section>
    <section class="panel"><h3>انتهوا آخر ٣٠ يوم (${ar(expired.length)})</h3>${expired.length?expired.map(a=>rowHTML(a,false)).join(''):'<p class="muted">ما في.</p>'}</section>`;
}

/* ---- التنقّل وزر الرجوع في تطبيق الأندرويد ---- */
const IN_APP=/ShattoorApp/.test(navigator.userAgent)||location.protocol==='file:';
function push(v){if(!IN_APP)return;try{if(history.state)history.replaceState({v},'','#'+v);else history.pushState({v},'','#'+v)}catch(e){}}
const rootView=()=>!APP.user?'auth':APP.child?'home':isAdmin()?'admin':'kids';
window.addEventListener('popstate',()=>{Q=null;go(rootView(),true)});
const VIEWS={lessons:viewLessons,auth:viewAuth,kids:viewKids,kidForm:viewKidForm,home:viewHome,parent:viewParent,sub:viewSub,admin:viewAdmin,store:viewStore,surahs:viewSurahs,surah:viewSurah,cert:viewCert};
function go(v,fromPop){
  v=v||rootView();
  if(!APP.user)v='auth';
  stopSpeak();
  if(['home','parent','sub','store','surahs','surah','cert','lessons'].includes(v)&&!APP.child)v=isAdmin()?'admin':'kids';
  if(v==='admin'&&!isAdmin())v='kids';
  if(v==='kids'){APP.child=null;S=null}
  const keep=ui.keep;ui={tab:ui.tab,mode:ui.mode,surah:ui.surah,subj:ui.subj,sem:v==='lessons'?ui.sem:null};if(keep)Object.assign(ui,keep);
  if(v!==rootView())push(v);else if(IN_APP&&!fromPop&&history.state){history.back();return}
  VIEWS[v]();window.scrollTo(0,0);
}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='mode'){ui.ap=val('ap')||ui.ap;ui.mode=b.dataset.m;ui.msg=null;viewAuth()}
  else if(a==='go'){if(b.dataset.v==='kidForm')ui.keep={edit:null};go(b.dataset.v)}
  else if(a==='pickKid')pickChild(b.dataset.id);
  else if(a==='kidGrade'){ui.kn=val('kn');ui.g=+b.dataset.g;viewKidForm()}
  else if(a==='editKid'){ui.keep={edit:APP.child.id};go('kidForm')}
  else if(a==='logout'){await API.signOut();APP.user=null;APP.child=null;APP.kids=[];S=null;ui={};go('auth',true)}
  else if(a==='daily'){if(!hasAccess())return go('sub');Q={mode:'daily',list:buildDaily(APP.child.grade),i:0,c:0,res:[]};push('quiz');viewQuiz();window.scrollTo(0,0)}
  else if(a==='practice'){if(!hasAccess())return go('sub');const s=b.dataset.s;Q={mode:'practice',s,list:buildPractice(s,APP.child.grade),i:0,c:0,res:[]};push('quiz');viewQuiz();window.scrollTo(0,0)}
  else if(a==='ans')answer(+b.dataset.i);
  else if(a==='tile')tileTap(+b.dataset.i);
  else if(a==='lessons'){ui.keep={subj:b.dataset.s};go('lessons')}
  else if(a==='sem'){ui.sem=+b.dataset.n;viewLessons()}
  else if(a==='practiceL'){if(!hasAccess())return go('sub');const s=b.dataset.s,li=+b.dataset.i;Q={mode:'practice',s,li,list:buildPractice(s,APP.child.grade,li),i:0,c:0,res:[]};push('quiz');viewQuiz();window.scrollTo(0,0)}
  else if(a==='untile')untile();
  else if(a==='spkQ')speakItem(Q.list[Q.i]);
  else if(a==='spkHadith'){const h=todayHadith();speak('قال رسول الله صلى الله عليه وسلم: '+h[0]+'. '+h[2])}
  else if(a==='buy'){const it=AVATARS.find(x=>x.id===b.dataset.id);if(bal()<it.p){ui.msg={t:`بدك ${ar(it.p-bal())} ياسمينة كمان لتشتري ${it.n}. حل تحدي اليوم والتمارين لتجمع أكتر!`}}else{S.spent=(S.spent||0)+it.p;S.owned=[...new Set([...(S.owned||['jas']),it.id])];S.avatar=it.id;save();tone(true);ui.msg={ok:true,t:`مبروك! صار عندك ${it.n} ${it.e}`}}viewStore()}
  else if(a==='wear'){S.avatar=b.dataset.id;save();ui.msg=null;viewStore()}
  else if(a==='surah'){ui.keep={surah:b.dataset.id};go('surah')}
  else if(a==='surahQuiz'){const su=SURAHS.find(x=>x.id===b.dataset.id);Q={mode:'surah',surah:su.id,list:surahQuiz(su),i:0,c:0,res:[]};push('quiz');viewQuiz();window.scrollTo(0,0)}
  else if(a==='autoread'){S.autoRead=!autoRead();save();viewParent()}
  else if(a==='remind'){ui.rmt=val('rmt')||'17:00';const on=!(S.remind&&S.remind.on);if(on&&NATIVE.notifyState&&NATIVE.notifyState()!=='granted'){ui.wantRemind=true;NATIVE.requestNotify()}else applyRemind(on)}
  else if(a==='certShare'){try{NATIVE.shareImage(ui.cert,'shattoor-certificate','شهادة تقدير من تطبيق شطّور 🌼')}catch(err){}}
  else if(a==='certSave'){try{NATIVE.saveImage(ui.cert,'shattoor-certificate')}catch(err){}}
  else if(a==='saveQr'){try{const im=V.querySelector('.sham img');const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);NATIVE.saveImage(c.toDataURL('image/png'),'shamcash-qr')}catch(err){}}
  else if(a==='copyText'){const t=b.dataset.t;const el=V.querySelector('#shamcode');const sel=()=>{if(!el)return;const r=document.createRange();r.selectNodeContents(el);const g=getSelection();g.removeAllRanges();g.addRange(r)};try{navigator.clipboard.writeText(t).then(()=>{b.textContent='تم النسخ ✓'},sel)}catch(err){sel()}}
  else if(a==='next'){Q.i++;Q.built=[];Q.usedT=[];Q.read=false;if(Q.i>=Q.list.length)finish();else{viewQuiz();window.scrollTo(0,0)}}
  else if(a==='quit'){Q=null;go('home')}
  else if(a==='sound'){S.sound=!S.sound;save();viewParent()}
  else if(a==='delKid'){ui.confirmDel=true;viewParent()}
  else if(a==='delNo'){ui.confirmDel=false;viewParent()}
  else if(a==='delYes'){const id=APP.child.id;busy(b);try{await API.deleteChild(id);try{localStorage.removeItem('shattoor_p_'+id)}catch(x){}APP.kids=APP.kids.filter(k=>k.id!==id);go('kids')}catch(err){ui.confirmDel=false;viewParent()}}
  else if(a==='plan'){ui.plan=b.dataset.p;ui.msg=null;viewSub()}
  else if(a==='meth'){ui.meth=b.dataset.m;ui.msg=null;viewSub()}
  else if(a==='mkReset'){busy(b);try{const k=await API.makeReset(ui.found.phone);ui.found.reset=k;ui.msg=null}catch(err){ui.msg={t:errMsg(err)}}viewAdmin()}
  else if(a==='copyCode'){const t=ui.found.reset;const el=V.querySelector('.codebox .code');const sel=()=>{const r=document.createRange();r.selectNodeContents(el);const g=getSelection();g.removeAllRanges();g.addRange(r)};try{navigator.clipboard.writeText(t).then(()=>{b.textContent='تم النسخ'},sel)}catch(err){sel()}}
  else if(a==='request'){const c=APP.child;busy(b,'جارِ الإرسال…');
    try{await API.requestSub({phone:APP.user.phone,parentName:APP.user.name,childId:c.id,childName:c.name,grade:c.grade,plan:ui.plan||'monthly',method:b.dataset.m||'',amount:price(ui.plan||'monthly')});await refreshReqs();ui.msg={ok:true,t:'وصل طلبك. رح يتفعّل الاشتراك بعد التأكد من الدفع.'}}
    catch(err){ui.msg={t:errMsg(err)}}viewSub()}
  else if(a==='recheck'){busy(b,'جارِ التحقق…');
    try{APP.kids=await API.listChildren();APP.child=APP.kids.find(k=>k.id===APP.child.id)||APP.child;await refreshReqs();
      ui.msg=hasSub()?{ok:true,t:'تم التفعيل!'}:{t:'لسا ما تفعّل. جرّب بعد شوي.'}}catch(err){ui.msg={t:errMsg(err)}}
    if(hasSub()){go('home',true)}else viewSub()}
  else if(a==='tab'){ui.tab=b.dataset.t;ui.msg=null;ui.found=null;viewAdmin()}
  else if(a==='approve'||a==='reject'){const r=ui.reqs[+b.dataset.i];busy(b);
    try{if(a==='approve'){const s=await API.activate(r.phone,r.childId,r.grade,r.plan);await API.resolve(r.id,'approved');ui.msg={ok:true,t:`تفعّل اشتراك ${esc(r.childName)} للصف ${GRADES[r.grade-1]} حتى ${fmtDay(s.until)}`}}
      else{await API.resolve(r.id,'rejected');ui.msg={ok:true,t:'تم رفض الطلب.'}}}
    catch(err){ui.msg={t:errMsg(err)}}viewAdmin()}
  else if(a==='admG'){ui['g'+b.dataset.i]=+b.dataset.g;viewAdmin()}
  else if(a==='admP'){ui['p'+b.dataset.i]=b.dataset.p;viewAdmin()}
  else if(a==='admAct'){const i=+b.dataset.i,k=ui.found.children[i],g=ui['g'+i]||k.grade,p=ui['p'+i]||'monthly';busy(b);
    try{const s=await API.activate(ui.found.phone,k.id,g,p);
      API.logActivation({phone:ui.found.phone,parentName:ui.found.name,childId:k.id,childName:k.name,grade:g,plan:p,amount:price(p),status:'approved',source:'admin'}).catch(()=>{});
      const pr=(await API.pending()).filter(r=>r.childId===k.id&&r.grade===g);for(const r of pr)await API.resolve(r.id,'merged');
      ui.msg={ok:true,t:`تفعّل اشتراك ${esc(k.name)} للصف ${GRADES[g-1]} حتى ${fmtDay(s.until)}`};await reloadFound()}
    catch(err){ui.msg={t:errMsg(err)}}viewAdmin()}
  else if(a==='cancelSub'){const k=ui.found.children[+b.dataset.i];busy(b);try{await API.cancelSub(ui.found.phone,k.id,b.dataset.g);ui.msg={ok:true,t:'تم إلغاء الاشتراك.'};await reloadFound()}catch(err){ui.msg={t:errMsg(err)}}viewAdmin()}
});

(async()=>{
  try{if(IN_APP&&history.state)history.replaceState(null,'',location.pathname)}catch(e){}
  viewLoading();
  try{APP.user=await API.init()}catch(e){APP.user=null}
  await loadSettings();
  if(!APP.user)return go('auth',true);
  try{APP.kids=await API.listChildren()}catch(e){APP.kids=[]}
  await refreshReqs();
  let last=null;try{last=localStorage.getItem('shattoor_last')}catch(e){}
  if(!isAdmin()&&last&&APP.kids.some(k=>k.id===last))return pickChild(last);
  if(!isAdmin()&&APP.kids.length===1)return pickChild(APP.kids[0].id);
  go(isAdmin()?'admin':'kids',true);
})();

</script>
