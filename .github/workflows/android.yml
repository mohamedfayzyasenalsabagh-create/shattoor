name: بناء تطبيق أندرويد
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      # مفتاح التوقيع لا يُحفظ في المستودع، بل في أسرار GitHub
      - name: تجهيز مفتاح التوقيع من الأسرار
        id: key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::لم تُضف أسرار التوقيع بعد، سيتم بناء نسخة تجريبية (debug)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: بناء النسخة الموقّعة
        if: steps.key.outputs.ok == 'true'
        env:
          VERSION_CODE: "${{ github.run_number }}"
          KEYSTORE_FILE: "${{ runner.temp }}/release.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          gradle -p android assembleRelease bundleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk shattoor.apk
          cp android/app/build/outputs/bundle/release/app-release.aab shattoor-play.aab

      - name: بناء نسخة تجريبية (بدون مفتاح)
        if: steps.key.outputs.ok != 'true'
        env:
          VERSION_CODE: "${{ github.run_number }}"
        run: |
          gradle -p android assembleDebug --no-daemon
          cp android/app/build/outputs/apk/debug/app-debug.apk shattoor.apk

      - name: حفظ الملف في فرع builds
        run: |
          mkdir -p /tmp/out && cp shattoor.apk /tmp/out/ && cp shattoor-play.aab /tmp/out/ 2>/dev/null || true
          git config user.name "shattoor-ci"; git config user.email "ci@shattoor.app"
          git fetch origin builds || true
          git checkout --orphan builds-tmp && git rm -rqf . && git clean -fdq
          cp /tmp/out/* . && echo "build ${{ github.run_number }} signed=${{ steps.key.outputs.ok }}" > BUILD.txt
          git add -f shattoor.apk BUILD.txt $(ls shattoor-play.aab 2>/dev/null) && git commit -qm "APK ${{ github.run_number }}"
          git push -f origin builds-tmp:builds

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: تطبيق شطّور (نسخة ${{ github.run_number }})
          make_latest: "true"
          files: |
            shattoor.apk
            shattoor-play.aab
          fail_on_unmatched_files: false
          body: "shattoor.apk للتثبيت المباشر على الموبايل."
