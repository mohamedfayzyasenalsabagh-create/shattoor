name: فحص التسجيل على الموقع الحقيقي
on:
  push:
    branches: [main]
    paths: [".github/workflows/diag.yml", "build-tools/diag/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm i --no-save playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - run: sleep 20
      - run: PH=0999000124 timeout 300 node build-tools/diag/signup.js || true
      - if: always()
        run: |
          mkdir -p /tmp/o && touch diag.txt && cp diag.txt /tmp/o/ && (cp diag.png /tmp/o/ || true)
          git config user.name "shattoor-ci"; git config user.email "ci@shattoor.app"
          git checkout --orphan diag-tmp && git rm -rqf . && git clean -fdq
          cp /tmp/o/* . && git add -A && git commit -qm diag && git push -f origin diag-tmp:diag
